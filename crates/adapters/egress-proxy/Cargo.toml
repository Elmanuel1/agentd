[package]
name = "egress-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "agentd's egress proxy: sandbox traffic leaves through it; it swaps credential placeholders for secrets and blocks what the session may not reach."

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
time = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[lints]
workspace = true
