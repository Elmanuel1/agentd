[package]
name = "egress"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "agentd-egress: the egress proxy as its own service, reading each credential from Secrets Manager when a request needs it."

[[bin]]
name = "agentd-egress"
path = "src/main.rs"

[dependencies]
egress-proxy = { workspace = true }
secrets-aws = { workspace = true }
shared = { workspace = true }
vaults = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
secrecy = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
aws-common = { workspace = true }
aws-sdk-kms = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
uuid = { workspace = true }

[lints]
workspace = true
