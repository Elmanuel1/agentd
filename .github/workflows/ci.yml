name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.94.0"
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentd
          POSTGRES_PASSWORD: agentd
          POSTGRES_DB: agentd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentd"
          --health-interval 2s --health-timeout 5s --health-retries 30
      localstack:
        image: localstack/localstack:3.0
        env:
          SERVICES: s3,secretsmanager,kms
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 2s --health-timeout 5s --health-retries 60
    env:
      DATABASE_URL: postgres://agentd:agentd@localhost:5432/agentd
      AGENTD_PG_TESTS: "1"
      AGENTD_DOCKER_TESTS: "1"
      AGENTD_AWS_ENDPOINT: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Migrate the schema with Flyway
        run: |
          docker run --rm --network host \
            -v "$PWD/crates/adapters/store-postgres/migrations:/flyway/sql" \
            flyway/flyway:11 \
            -url=jdbc:postgresql://localhost:5432/agentd -user=agentd -password=agentd \
            -locations=filesystem:/flyway/sql migrate
      - run: cargo test --workspace --locked --no-fail-fast

  sdk:
    # The official SDKs, with only the base URL changed, against the built binary.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentd
          POSTGRES_PASSWORD: agentd
          POSTGRES_DB: agentd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentd"
          --health-interval 2s --health-timeout 5s --health-retries 30
      localstack:
        image: localstack/localstack:3.0
        env:
          SERVICES: s3,secretsmanager,kms
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 2s --health-timeout 5s --health-retries 60
    env:
      DATABASE_URL: postgres://agentd:agentd@localhost:5432/agentd
      AGENTD_AWS_ENDPOINT: http://localhost:4566
      AGENTD_S3_CREATE_BUCKET: "1"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      # Credentials go to Secrets Manager and KMS on LocalStack, as in production.
      AGENTD_SECRETS_ENDPOINT: http://localhost:4566
      # Every log line, so the last check shows no secret or key reaches one.
      RUST_LOG: trace
      AGENTD_ADDR: 127.0.0.1:8080
      AGENTD_BASE_URL: http://127.0.0.1:8080
      # Each session gets its container on the runner's Docker daemon.
      AGENTD_RUNTIME: docker
      AGENTD_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Migrate the schema with Flyway
        run: |
          docker run --rm --network host \
            -v "$PWD/crates/adapters/store-postgres/migrations:/flyway/sql" \
            flyway/flyway:11 \
            -url=jdbc:postgresql://localhost:5432/agentd -user=agentd -password=agentd \
            -locations=filesystem:/flyway/sql migrate
      - run: cargo build --locked -p api
      - name: Create the secrets KMS key on LocalStack
        run: |
          key=$(aws --endpoint-url http://localhost:4566 kms create-key --query KeyMetadata.Arn --output text)
          echo "AGENTD_SECRETS_KMS_KEY_ID=$key" >> "$GITHUB_ENV"
      - name: Create the SDK API key with the CLI
        run: |
          key=$(./target/debug/agentd keys create --org org_sdk --workspace wrkspc_sdk --name sdk)
          echo "::add-mask::$key"
          echo "AGENTD_TEST_KEY=$key" >> "$GITHUB_ENV"
      - name: Start agentd
        run: |
          nohup ./target/debug/agentd > agentd.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8080/ && exit 0; sleep 1; done
          cat agentd.log; exit 1
      - name: Python SDK (anthropic 2.3.0)
        working-directory: conformance/python
        run: |
          pip install -r requirements.txt
          pytest -q
      - name: TypeScript SDK (@anthropic-ai/sdk 1.3.0)
        working-directory: conformance/typescript
        run: |
          npm ci
          npm test
      - name: Credentials are in Secrets Manager under the key, and no secret or key is logged
        run: |
          secrets=$(aws --endpoint-url http://localhost:4566 secretsmanager list-secrets --include-planned-deletion \
            --filters Key=name,Values=agentd/wrkspc_sdk/ --output json)
          echo "$secrets" | jq -e --arg key "$AGENTD_SECRETS_KMS_KEY_ID" '
            .SecretList | length >= 2 and all(
              .KmsKeyId == $key and .DeletedDate != null
              and ([.Tags[] | select(.Key == "managed-by" and .Value == "agentd")] | length == 1))'
          test -z "$(aws --endpoint-url http://localhost:4566 s3 ls s3://agentd-artifacts/secrets/ --recursive)"
          if grep -qE "sdk-token-|ts-token-" agentd.log; then echo "a credential reached the log"; exit 1; fi
          if grep -qF "$AGENTD_TEST_KEY" agentd.log; then echo "the API key reached the log"; exit 1; fi
          ./target/debug/agentd keys list | grep -q "wrkspc_sdk"
      - if: failure()
        run: cat agentd.log

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: agentd:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The binary must start in the runtime image (a glibc mismatch between
      # the build and runtime bases only shows here): a bad config is its
      # first answer, before it touches any backend.
      - name: Start the binary
        run: |
          out=$(docker run --rm -e AGENTD_STORE=none agentd:ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "invalid configuration: AGENTD_STORE"
