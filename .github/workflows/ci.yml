name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.100.0"
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc and the well-known protobuf types (the Temporal SDK's build), and OpenSSL's headers (librdkafka's TLS)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev libssl-dev
      - run: cargo fmt --all --check
      # clippy.toml's banned macros warn until the #[async_trait] uses are migrated.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings --force-warn clippy::disallowed_macros

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentd
          POSTGRES_PASSWORD: agentd
          POSTGRES_DB: agentd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentd"
          --health-interval 2s --health-timeout 5s --health-retries 30
      localstack:
        image: localstack/localstack:3.0
        env:
          SERVICES: s3,secretsmanager,kms,ssm
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 2s --health-timeout 5s --health-retries 60
      valkey:
        image: valkey/valkey:8.0-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://agentd:agentd@localhost:5432/agentd
      AGENTD_PG_TESTS: "1"
      AGENTD_CDC_TESTS: "1"
      AGENTD_MIGRATION_SEED: "1"
      AGENTD_AWS_ENDPOINT: http://localhost:4566
      AGENTD_VALKEY_URL: redis://localhost:6379
      AGENTD_VALKEY_CLUSTER_URL: redis://127.0.0.1:7001
      AGENTD_KAFKA_BROKERS: localhost:9092
      AGENTD_TEMPORAL_ADDRESS: http://localhost:7233
      TEMPORAL_CLI_VERSION: "1.10.1"
      # The TLS servers' test CA (docker/tls/certs.sh), and the rediss:// Valkey it signs.
      AGENTD_PG_TLS_CA: /tmp/agentd-tls/ca.pem
      AGENTD_KAFKA_TLS_CA: /tmp/agentd-tls/ca.pem
      AGENTD_VALKEY_TLS_URL: rediss://localhost:6390
      AGENTD_VALKEY_TLS_CA: /tmp/agentd-tls/ca.pem
      AGENTD_TEMPORAL_TLS_CA: /tmp/agentd-tls/ca.pem
      AGENTD_OTLP_TLS_CA: /tmp/agentd-tls/ca.pem
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc and the well-known protobuf types (the Temporal SDK's build), and OpenSSL's headers (librdkafka's TLS)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev libssl-dev
      - name: Migrate the schema with Flyway, seeding environment revisions before V28 copies them
        run: |
          flyway() {
            docker run --rm --network host \
              -v "$PWD/crates/adapters/store-postgres/migrations:/flyway/sql" \
              flyway/flyway:11 \
              -url=jdbc:postgresql://localhost:5432/agentd -user=agentd -password=agentd \
              -locations=filesystem:/flyway/sql -postgresql.transactional.lock=false "$@" migrate
          }
          flyway -target=27
          docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U agentd agentd \
            < crates/adapters/store-postgres/tests/fixtures/environment_revisions.sql
          flyway
      - name: Start Kafka
        run: docker/kafka/start.sh
      - name: Start the change feed (logical WAL, Debezium Server into Kafka)
        run: docker/debezium/start-ci.sh "${{ job.services.postgres.id }}" kafka localhost:9092
      - name: Start a one-node Valkey cluster, for the cluster-mode tests
        run: docker/valkey/start-cluster.sh 7001
      - name: Start a Postgres, a Kafka and a Valkey that serve TLS, signed by a test CA
        run: |
          docker/postgres/start-tls.sh /tmp/agentd-tls
          docker/kafka/start-secure.sh /tmp/agentd-tls
          docker/valkey/start-tls.sh /tmp/agentd-tls
      - name: Start a Temporal dev server, for the Temporal scheduler sink's tests
        run: |
          curl -sfL "https://github.com/temporalio/cli/releases/download/v${TEMPORAL_CLI_VERSION}/temporal_cli_${TEMPORAL_CLI_VERSION}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin temporal
          nohup temporal server start-dev --headless --port 7233 > temporal.log 2>&1 &
          for _ in $(seq 1 60); do temporal operator cluster health --address localhost:7233 >/dev/null 2>&1 && exit 0; sleep 1; done
          tail -20 temporal.log; exit 1
      - run: cargo test --workspace --locked --no-fail-fast
        env:
          AGENTD_FAULT_TESTS: "1"
          AGENTD_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Move the change feed to Valkey Streams
        run: |
          docker rm -f debezium >/dev/null
          docker/debezium/start-ci.sh "${{ job.services.postgres.id }}" redis localhost:6379 false
      - name: The change feed on Valkey Streams
        run: env -u AGENTD_KAFKA_BROKERS cargo test -p api --locked --test change_feed
      - if: failure()
        run: docker logs debezium 2>&1 | tail -200

  sdk:
    # The official SDKs, with only the base URL changed, against the built binary.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentd
          POSTGRES_PASSWORD: agentd
          POSTGRES_DB: agentd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentd"
          --health-interval 2s --health-timeout 5s --health-retries 30
      localstack:
        image: localstack/localstack:3.0
        env:
          SERVICES: s3,secretsmanager,kms
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 2s --health-timeout 5s --health-retries 60
    env:
      DATABASE_URL: postgres://agentd:agentd@localhost:5432/agentd
      AGENTD_AWS_ENDPOINT: http://localhost:4566
      AGENTD_VALKEY_URL: redis://127.0.0.1:7001
      AGENTD_VALKEY_CLUSTER: "1"
      AGENTD_S3_CREATE_BUCKET: "1"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      # Every log line, so the last check shows no secret or key reaches one.
      RUST_LOG: trace
      AGENTD_ADDR: 0.0.0.0:8080
      AGENTD_BASE_URL: http://127.0.0.1:8080
      AGENTD_API_BASE_URL: http://127.0.0.1:8080
      # The loop calls the scripted model as an OpenAI-compatible provider.
      AGENTD_MODELS: mock/scripted
      AGENTD_MODEL_BASE_URL: http://127.0.0.1:18766/v1
      # Tools run on the official worker (`ant beta:worker poll`) on the runner.
      AGENTD_TEST_WORKER: "1"
      AGENTD_TEST_ORG: org_sdk
      AGENTD_TEST_WORKSPACE: wrkspc_sdk
      AGENTD_BIN: ${{ github.workspace }}/target/debug/agentd
      ANT_VERSION: "1.39.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc and the well-known protobuf types (the Temporal SDK's build), and OpenSSL's headers (librdkafka's TLS)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev libssl-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Migrate the schema with Flyway
        run: |
          docker run --rm --network host \
            -v "$PWD/crates/adapters/store-postgres/migrations:/flyway/sql" \
            flyway/flyway:11 \
            -url=jdbc:postgresql://localhost:5432/agentd -user=agentd -password=agentd \
            -locations=filesystem:/flyway/sql -postgresql.transactional.lock=false migrate
      - name: Start a one-node Valkey cluster, as production runs
        run: docker/valkey/start-cluster.sh 7001
      - name: Start the change feed (logical WAL, Debezium Server into the cluster's streams)
        run: docker/debezium/start-ci.sh "${{ job.services.postgres.id }}" redis localhost:7001 true
      - name: Install the ant CLI, whose worker runs the tools
        run: |
          curl -sfL "https://github.com/anthropics/anthropic-cli/releases/download/v${ANT_VERSION}/ant_${ANT_VERSION}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin ant
          ant --version
      - name: Start the scripted model
        run: nohup python3 conformance/mock_model.py --port 18766 --model mock/scripted conformance/fixtures/mock-model.json > model.log 2>&1 &
      - run: cargo build --locked -p api
      - name: Give agentd its keys through the environment
        # No KMS key is set, so credentials are sealed in Postgres, the default store.
        run: |
          for var in AGENTD_API_KEY_PEPPERS AGENTD_WORK_TOKEN_KEYS AGENTD_PLACEHOLDER_KEYS AGENTD_SECRET_KEYS; do
            ring="k1:$(openssl rand -hex 32)"
            echo "::add-mask::$ring"
            echo "$var=$ring" >> "$GITHUB_ENV"
          done
          model="mock-model-key-$(openssl rand -hex 8)"
          echo "::add-mask::$model"
          echo "AGENTD_OPENROUTER_API_KEY=$model" >> "$GITHUB_ENV"
      - name: Create the SDK API key with the CLI
        run: |
          key=$(./target/debug/agentd keys create --org org_sdk --workspace wrkspc_sdk --name sdk)
          echo "::add-mask::$key"
          echo "AGENTD_TEST_KEY=$key" >> "$GITHUB_ENV"
      - name: Create the SDK admin key with the CLI
        run: |
          key=$(./target/debug/agentd admin-keys create --org org_sdk --name sdk)
          echo "::add-mask::$key"
          echo "AGENTD_TEST_ADMIN_KEY=$key" >> "$GITHUB_ENV"
      - name: Start agentd
        run: |
          nohup ./target/debug/agentd > agentd.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8080/ && exit 0; sleep 1; done
          cat agentd.log; exit 1
      - name: Python SDK (anthropic 2.3.0)
        working-directory: conformance/python
        run: |
          pip install -r requirements.txt
          pytest -q
      - name: TypeScript SDK (@anthropic-ai/sdk 1.3.0)
        working-directory: conformance/typescript
        run: |
          npm ci
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Java SDK (com.anthropic:anthropic-java 2.52.0)
        working-directory: conformance/java
        run: ./gradlew test --no-daemon
      - name: Credentials were sealed in Postgres and deleted, none went to Secrets Manager, and no secret or key is logged
        run: |
          sql() { docker exec "${{ job.services.postgres.id }}" psql -U agentd -d agentd -tAc "$1"; }
          test "$(sql "SELECT n_tup_ins > 0 FROM pg_stat_user_tables WHERE relname = 'vault_secrets'")" = t
          test "$(sql "SELECT count(*) FROM vault_secrets")" = 0
          aws --endpoint-url http://localhost:4566 secretsmanager list-secrets --include-planned-deletion --output json \
            | jq -e '.SecretList | length == 0'
          test -z "$(aws --endpoint-url http://localhost:4566 s3 ls s3://agentd-artifacts/secrets/ --recursive)"
          if grep -qE "sdk-token-|ts-token-|s3cret-|mock-model-key-" agentd.log; then echo "a credential reached a log"; exit 1; fi
          if grep -qF "$AGENTD_TEST_KEY" agentd.log; then echo "the API key reached the log"; exit 1; fi
          if grep -qF "${AGENTD_SECRET_KEYS#*:}" agentd.log; then echo "a master key reached the log"; exit 1; fi
          ./target/debug/agentd keys list | grep -q "wrkspc_sdk"
      - name: A revoked key is refused on the next request
        run: |
          call() { curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/v1/agents \
            -H "anthropic-version: 2023-06-01" -H "anthropic-beta: managed-agents-2026-04-01" -H "x-api-key: $AGENTD_TEST_KEY"; }
          test "$(call)" = 200
          id=$(./target/debug/agentd keys list | awk -F '\t' '$3 == "wrkspc_sdk" && $4 == "active" { print $1 }')
          ./target/debug/agentd keys revoke "$id"
          test "$(call)" = 401
      - name: Archiving a workspace revokes its keys
        run: |
          admin() { curl -sf http://127.0.0.1:8080/v1/organizations/workspaces"$1" -X POST \
            -H "anthropic-version: 2023-06-01" -H "x-api-key: $AGENTD_TEST_ADMIN_KEY" -H "content-type: application/json" -d "$2"; }
          ws=$(admin "" '{"name":"ci-archive"}' | jq -r .id)
          key=$(./target/debug/agentd keys create --org org_sdk --workspace "$ws" --name archive)
          echo "::add-mask::$key"
          call() { curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/v1/agents \
            -H "anthropic-version: 2023-06-01" -H "anthropic-beta: managed-agents-2026-04-01" -H "x-api-key: $key"; }
          test "$(call)" = 200
          admin "/$ws/archive" '' | jq -e '.archived_at != null'
          test "$(call)" = 401
      - if: failure()
        run: |
          cat agentd.log model.log
          docker logs debezium 2>&1 | tail -200

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: agentd:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The binary must start in the runtime image (a glibc mismatch between
      # the build and runtime bases only shows here): a bad config is its
      # first answer, before it touches any backend.
      - name: Start the binary
        run: |
          out=$(docker run --rm -e AGENTD_STORE=none agentd:ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "invalid configuration: AGENTD_STORE"
