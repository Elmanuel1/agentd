name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.94.0"
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentd
          POSTGRES_PASSWORD: agentd
          POSTGRES_DB: agentd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentd"
          --health-interval 2s --health-timeout 5s --health-retries 30
      localstack:
        image: localstack/localstack:3.0
        env:
          SERVICES: s3
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 2s --health-timeout 5s --health-retries 60
    env:
      DATABASE_URL: postgres://agentd:agentd@localhost:5432/agentd
      AGENTD_PG_TESTS: "1"
      AGENTD_AWS_ENDPOINT: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Migrate the schema with Flyway
        run: |
          docker run --rm --network host \
            -v "$PWD/crates/agentd-store-postgres/migrations:/flyway/sql" \
            flyway/flyway:11 \
            -url=jdbc:postgresql://localhost:5432/agentd -user=agentd -password=agentd \
            -locations=filesystem:/flyway/sql migrate
      - run: cargo test --workspace --locked --no-fail-fast

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
