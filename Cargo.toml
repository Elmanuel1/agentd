[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/resources/agents",
    "crates/resources/environments",
    "crates/resources/api-keys",
    "crates/resources/organizations",
    "crates/resources/vaults",
    "crates/resources/webhooks",
    "crates/resources/memory",
    "crates/resources/files",
    "crates/resources/skills",
    "crates/resources/sessions",
    "crates/resources/deployments",
    "crates/resources/work",
    "crates/resources/dreams",
    "crates/resources/history",
    "crates/api",
    "conformance/rust",
    "crates/adapters/store-postgres",
    "crates/adapters/blobs-s3",
    "crates/test-support",
    "crates/adapters/secrets-aws",
    "crates/adapters/aws-common",
    "crates/adapters/signals-valkey",
    "crates/adapters/changes-kafka",
    "crates/adapters/scheduler-temporal",
    "crates/engine",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "UNLICENSED"

[workspace.dependencies]
# intra-workspace
shared = { path = "crates/shared" }
agents = { path = "crates/resources/agents" }
environments = { path = "crates/resources/environments" }
api-keys = { path = "crates/resources/api-keys" }
organizations = { path = "crates/resources/organizations" }
vaults = { path = "crates/resources/vaults" }
webhooks = { path = "crates/resources/webhooks" }
memory = { path = "crates/resources/memory" }
files = { path = "crates/resources/files" }
skills = { path = "crates/resources/skills" }
sessions = { path = "crates/resources/sessions" }
deployments = { path = "crates/resources/deployments" }
work = { path = "crates/resources/work" }
dreams = { path = "crates/resources/dreams" }
history = { path = "crates/resources/history" }
api = { path = "crates/api" }
store-postgres = { path = "crates/adapters/store-postgres" }
blobs-s3 = { path = "crates/adapters/blobs-s3" }
test-support = { path = "crates/test-support" }
secrets-aws = { path = "crates/adapters/secrets-aws" }
aws-common = { path = "crates/adapters/aws-common" }
signals-valkey = { path = "crates/adapters/signals-valkey" }
changes-kafka = { path = "crates/adapters/changes-kafka" }
scheduler-temporal = { path = "crates/adapters/scheduler-temporal" }
engine = { path = "crates/engine" }

# external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
thiserror = "2"
async-trait = "0.1"
rand = "0.10"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
base64 = "0.23"
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["full"] }
deadpool = { version = "0.13", default-features = false, features = ["managed", "rt_tokio_1"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
futures = "0.3"
temporalio-client = { version = "1.2.0", default-features = false, features = ["tls-aws-lc"] }
temporalio-sdk = { version = "1.2.0", default-features = false }
temporalio-macros = "1.2.0"
temporalio-workflow = { version = "1.2.0", default-features = false }
temporalio-common = { version = "1.2.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "connection-manager", "streams", "cluster-async"] }
rdkafka = { version = "0.39", default-features = false, features = ["tokio", "libz-static", "ssl"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "metrics", "trace", "logs", "tls-aws-lc", "tls-roots"] }
opentelemetry-appender-tracing = "0.33"
tracing-opentelemetry = "0.34"
bytes = "1"
parking_lot = "0.13"
uuid = { version = "1", features = ["v4"] }
aws-config = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-runtime-api = "1"
aws-smithy-async = { version = "1", features = ["test-util"] }
aws-credential-types = "1"
aws-smithy-types = "1"
secrecy = "0.10"
zeroize = { version = "1", features = ["serde"] }
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys", "alloc"] }
diesel = { version = "2.4", default-features = false, features = ["postgres_backend", "serde_json", "chrono"] }
diesel-async = { version = "0.10", default-features = false, features = ["postgres", "deadpool"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "0.14", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
percent-encoding = "2"
url = "2"
aws-sigv4 = { version = "1", features = ["sign-http"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
