[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/resources/agents",
    "crates/resources/environments",
    "crates/resources/vaults",
    "crates/resources/memory",
    "crates/resources/files",
    "crates/resources/skills",
    "crates/resources/sessions",
    "crates/resources/deployments",
    "crates/resources/dreams",
    "crates/adapters/scheduler-local",
    "crates/engine",
    "crates/api",
    "conformance/rust",
    "crates/adapters/store-postgres",
    "crates/adapters/blobs-s3",
    "crates/adapters/secrets-blob",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
# intra-workspace
shared = { path = "crates/shared" }
agents = { path = "crates/resources/agents" }
environments = { path = "crates/resources/environments" }
vaults = { path = "crates/resources/vaults" }
memory = { path = "crates/resources/memory" }
files = { path = "crates/resources/files" }
skills = { path = "crates/resources/skills" }
sessions = { path = "crates/resources/sessions" }
deployments = { path = "crates/resources/deployments" }
dreams = { path = "crates/resources/dreams" }
scheduler-local = { path = "crates/adapters/scheduler-local" }
engine = { path = "crates/engine" }
api = { path = "crates/api" }
store-postgres = { path = "crates/adapters/store-postgres" }
blobs-s3 = { path = "crates/adapters/blobs-s3" }
secrets-blob = { path = "crates/adapters/secrets-blob" }

# external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
thiserror = "2"
async-trait = "0.1"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
futures = "0.3"
tracing = "0.1"
bytes = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
aws-config = { version = "1", default-features = false, features = ["rustls", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
aws-smithy-runtime-api = "1"
diesel = { version = "2.2", default-features = false, features = ["postgres_backend", "serde_json", "chrono"] }
diesel-async = { version = "0.5", default-features = false, features = ["postgres", "deadpool"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
