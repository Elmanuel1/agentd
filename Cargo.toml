[workspace]
resolver = "2"
members = [
    "crates/agentd-core",
    "crates/agentd-agents",
    "crates/agentd-environments",
    "crates/agentd-vaults",
    "crates/agentd-memory",
    "crates/agentd-files",
    "crates/agentd-skills",
    "crates/agentd-sessions",
    "crates/agentd-deployments",
    "crates/agentd-dreams",
    "crates/agentd-scheduler",
    "crates/agentd-engine",
    "crates/agentd-api",
    "crates/agentd-conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
# intra-workspace
agentd-core = { path = "crates/agentd-core" }
agentd-agents = { path = "crates/agentd-agents" }
agentd-environments = { path = "crates/agentd-environments" }
agentd-vaults = { path = "crates/agentd-vaults" }
agentd-memory = { path = "crates/agentd-memory" }
agentd-files = { path = "crates/agentd-files" }
agentd-skills = { path = "crates/agentd-skills" }
agentd-sessions = { path = "crates/agentd-sessions" }
agentd-deployments = { path = "crates/agentd-deployments" }
agentd-dreams = { path = "crates/agentd-dreams" }
agentd-scheduler = { path = "crates/agentd-scheduler" }
agentd-engine = { path = "crates/agentd-engine" }
agentd-api = { path = "crates/agentd-api" }

# external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
thiserror = "2"
async-trait = "0.1"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
futures = "0.3"
tracing = "0.1"
bytes = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
