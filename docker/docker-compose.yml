# agentd stack.
#
# DEFAULT persistence: PostgreSQL (Flyway-migrated) — chosen because the
# product is dashboard-first (list / filter / sort / search / count are plain
# SQL). Records live in Postgres and blobs in object storage; event streams
# and the local scheduler are per process, so run one replica.

services:
  # ── migrations: Flyway 11 applies the schema, then exits ──────────────
  flyway:
    image: flyway/flyway:11-alpine
    command: >
      -url=jdbc:postgresql://postgres:5432/agentd
      -user=agentd -password=${POSTGRES_PASSWORD:-agentd}
      -locations=filesystem:/flyway/sql -connectRetries=20 migrate
    volumes:
      - ../crates/adapters/store-postgres/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  agentd:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      AGENTD_ADDR: 0.0.0.0:8080
      AGENTD_API_KEYS: ${AGENTD_API_KEYS:-agentd-dev-key:org_dev:wrkspc_01dev}
      # Records → Postgres; file BYTES → object storage (LocalStack S3 locally, real S3 in prod).
      AGENTD_STORE: ${AGENTD_STORE:-postgres}
      DATABASE_URL: postgres://agentd:${POSTGRES_PASSWORD:-agentd}@postgres:5432/agentd
      AGENTD_AWS_ENDPOINT: http://s3:4566        # blobs; drop this for real S3
      AGENTD_S3_CREATE_BUCKET: "1"
      # Credentials as plain objects in the blob store: development only.
      # Production uses AGENTD_SECRETS=aws (docs/configuration.md).
      AGENTD_SECRETS: blob
      AGENTD_DEV_SECRETS: "1"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully   # schema ready before boot
      s3:
        condition: service_healthy
    deploy:
      replicas: ${AGENTD_REPLICAS:-1}   # one: event streams and timers are per process

  postgres:
    image: postgres:16-alpine   # Flyway 11 supports PG 9.5–latest; 16 is the safe LTS-grade pick
    environment:
      POSTGRES_DB: agentd
      POSTGRES_USER: agentd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentd}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentd"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Object storage for file BYTES (never in the DB): LocalStack's S3 locally
  # (MinIO no longer publishes public images); drop AGENTD_AWS_ENDPOINT to
  # use AWS S3 directly.
  s3:
    image: localstack/localstack:3.0
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  pg_data:
