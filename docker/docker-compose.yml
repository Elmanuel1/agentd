# agentd stack for development: agentd, Postgres (migrated by Flyway, with
# logical WAL), Debezium Server reading the WAL into Kafka, Kafka for the
# change feed, Valkey (a one-node cluster with AOF) for the replicas' signals
# and the model budget, and LocalStack
# for S3, with Secrets Manager, SSM and KMS to try the AWS secret stores. Vault credentials
# are sealed in Postgres under AGENTD_SECRET_KEYS, as on the default store in production;
# there is no weaker mode. Every published
# port is bound to 127.0.0.1. Tools run on a worker that polls the session's
# environment (`ant beta:worker poll`), outside this stack.
#
#   export POSTGRES_PASSWORD=$(openssl rand -hex 16)
#   for v in AGENTD_API_KEY_PEPPERS AGENTD_WORK_TOKEN_KEYS AGENTD_PLACEHOLDER_KEYS AGENTD_SECRET_KEYS; do
#     export "$v=k1:$(openssl rand -hex 32)"; done
#   export AGENTD_OPENROUTER_API_KEY=...   # or AGENTD_ANTHROPIC_API_KEY, for the loop
#   docker compose -f docker/docker-compose.yml up
#   docker compose -f docker/docker-compose.yml logs keys   # the dev API key, printed once

x-agentd: &agentd
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: agentd:dev
  environment: &agentd-env
    AGENTD_ADDR: 0.0.0.0:8080
    DATABASE_URL: postgres://agentd:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/agentd
    # Blobs on the emulator; drop the endpoint for AWS.
    AGENTD_AWS_ENDPOINT: http://localstack:4566
    AGENTD_S3_CREATE_BUCKET: "1"
    AGENTD_VALKEY_URL: redis://valkey:6379
    AGENTD_VALKEY_CLUSTER: "1"
    AGENTD_KAFKA_BROKERS: kafka:9092
    # Only the emulator accepts these.
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    AWS_DEFAULT_REGION: us-east-1
    # agentd's API as workers reach it, the work secret's `api_base_url`.
    AGENTD_API_BASE_URL: http://127.0.0.1:8080
    # Key rings `<id>:<hex>,…`; the first signs or keys, the rest only verify.
    AGENTD_API_KEY_PEPPERS: ${AGENTD_API_KEY_PEPPERS:?set AGENTD_API_KEY_PEPPERS}
    AGENTD_WORK_TOKEN_KEYS: ${AGENTD_WORK_TOKEN_KEYS:?set AGENTD_WORK_TOKEN_KEYS}
    AGENTD_PLACEHOLDER_KEYS: ${AGENTD_PLACEHOLDER_KEYS:?set AGENTD_PLACEHOLDER_KEYS}
    # The master keys vault credentials are sealed under, each 32 bytes.
    AGENTD_SECRET_KEYS: ${AGENTD_SECRET_KEYS:?set AGENTD_SECRET_KEYS}
    # agentd's runtime keys (`sk-ant-oat01-…`, current first) and the model keys.
    AGENTD_RUNTIME_KEYS: ${AGENTD_RUNTIME_KEYS:-}
    AGENTD_ANTHROPIC_API_KEY: ${AGENTD_ANTHROPIC_API_KEY:-}
    AGENTD_OPENROUTER_API_KEY: ${AGENTD_OPENROUTER_API_KEY:-}
    RUST_LOG: info

services:
  # ── migrations: Flyway 11 applies the schema, then exits ──────────────
  flyway:
    image: flyway/flyway:11-alpine
    command: >
      -url=jdbc:postgresql://postgres:5432/agentd
      -user=agentd -password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      -locations=filesystem:/flyway/sql -connectRetries=20
      -postgresql.transactional.lock=false migrate
    volumes:
      - ../crates/adapters/store-postgres/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ── the dev API key, made through the CLI at startup ───────────────────
  # Each start makes the dev organization (on a restart it exists already, and
  # the create says so), revokes the previous dev key and prints a new one, so
  # exactly one is ever active.
  keys:
    <<: *agentd
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        { agentd organization create --id org_dev || true; }
        && agentd keys list
        | awk -F '\t' '$$3 == "wrkspc_01dev" && $$4 == "active" && $$7 == "dev" { print $$1 }'
        | xargs -r -n1 agentd keys revoke
        && agentd keys create --org org_dev --workspace wrkspc_01dev --name dev
    depends_on:
      flyway:
        condition: service_completed_successfully

  agentd:
    <<: *agentd
    container_name: ${AGENTD_CONTAINER:-agentd}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully   # schema ready before boot
      localstack:
        condition: service_healthy
      valkey:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      replicas: ${AGENTD_REPLICAS:-1}


  postgres:
    image: postgres:16-alpine   # Flyway 11 supports PG 9.5–latest; 16 is the safe LTS-grade pick
    # Logical WAL for Debezium; a slot that falls behind keeps at most 1 GB.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=1GB"]
    environment:
      POSTGRES_DB: agentd
      POSTGRES_USER: agentd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentd"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The replicas' pub/sub signals and the model budget's counters.
  # A one-node cluster, as production runs (cluster mode enabled), announced
  # by its name on this network; AOF, fsynced every second, keeps the streams
  # across a restart. The first health check gives the node every slot.
  valkey:
    image: valkey/valkey:9.0-alpine
    command:
      - valkey-server
      - --cluster-enabled
      - "yes"
      - --cluster-announce-hostname
      - valkey
      - --cluster-preferred-endpoint-type
      - hostname
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - valkey_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          valkey-cli cluster info | grep -q cluster_state:ok
          || { valkey-cli cluster addslotsrange 0 16383 >/dev/null; false; }
      interval: 3s
      timeout: 3s
      retries: 20

  # Debezium Server: the committed changes of the tables in
  # debezium/application.properties, from the WAL into Kafka. One instance:
  # a second could not take the replication slot.
  debezium:
    image: quay.io/debezium/server:3.3.1.Final
    environment:
      DEBEZIUM_SOURCE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DEBEZIUM_SOURCE_OFFSET_STORAGE_JDBC_CONNECTION_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ./debezium:/debezium/config:ro
    restart: unless-stopped
    depends_on:
      flyway:
        condition: service_completed_successfully   # its tables exist before the publication
      kafka:
        condition: service_healthy

  # The change feed: one Kafka node (KRaft), each topic made on first write
  # with one partition, kept 7 days.
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30

  # S3, and Secrets Manager, SSM and KMS for the AWS secret stores. Healthy once
  # the init hook has made the KMS key (docker/localstack/ready.d).
  localstack:
    image: localstack/localstack:3.0
    environment:
      SERVICES: s3,secretsmanager,ssm,kms
    volumes:
      - ./localstack/ready.d:/etc/localstack/init/ready.d:ro
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "awslocal kms describe-key --key-id alias/agentd-secrets >/dev/null"]
      interval: 3s
      timeout: 30s
      start_period: 60s
      retries: 60

volumes:
  pg_data:
  valkey_data:
  kafka_data:
