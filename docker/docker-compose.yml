# agentd stack for development: agentd, its egress service, Postgres
# (migrated by Flyway), and LocalStack for S3, Secrets Manager and KMS. Vault credentials are encrypted
# under a KMS key on the emulator exactly as in production; there is no weaker
# mode. Event streams and the local scheduler are per process, so run one
# replica. Every published port is bound to 127.0.0.1.
#
#   export POSTGRES_PASSWORD=$(openssl rand -hex 16) AGENTD_EGRESS_ADMIN_TOKEN=$(openssl rand -hex 32)
#   docker compose -f docker/docker-compose.yml up
#   docker compose -f docker/docker-compose.yml logs keys   # the dev API key, printed once

x-agentd: &agentd
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: agentd:dev
  environment: &agentd-env
    AGENTD_ADDR: 0.0.0.0:8080
    DATABASE_URL: postgres://agentd:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/agentd
    # Blobs, secrets and the KMS key on the emulator; drop both endpoints for AWS.
    AGENTD_AWS_ENDPOINT: http://localstack:4566
    AGENTD_S3_CREATE_BUCKET: "1"
    AGENTD_SECRETS_ENDPOINT: http://localstack:4566
    AGENTD_SECRETS_KMS_KEY_ID: alias/agentd-secrets
    # Only the emulator accepts these.
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    AWS_DEFAULT_REGION: us-east-1
    # Each session's sandbox runs on the host's Docker daemon, reached through
    # a proxy that allows only the API groups the sandbox runtime uses.
    DOCKER_HOST: tcp://docker:2375
    # Sandbox traffic leaves through the egress service; agentd registers
    # sessions on its admin interface, on the control network only the two
    # share. Both containers join each sandbox's own network, by name
    # (AGENTD_CONTAINER and AGENTD_CONTROL_NET keep a second stack apart).
    AGENTD_EGRESS_ADMIN_URL: http://${AGENTD_CONTROL_NET:-172.31.250}.3:8891
    AGENTD_EGRESS_ADMIN_TOKEN: ${AGENTD_EGRESS_ADMIN_TOKEN:?set AGENTD_EGRESS_ADMIN_TOKEN}
    AGENTD_SANDBOX_JOIN: ${AGENTD_CONTAINER:-agentd},${AGENTD_CONTAINER:-agentd}-egress
    RUST_LOG: info

services:
  # ── migrations: Flyway 11 applies the schema, then exits ──────────────
  flyway:
    image: flyway/flyway:11-alpine
    command: >
      -url=jdbc:postgresql://postgres:5432/agentd
      -user=agentd -password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      -locations=filesystem:/flyway/sql -connectRetries=20 migrate
    volumes:
      - ../crates/adapters/store-postgres/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ── the dev API key, made through the CLI at startup ───────────────────
  # Each start revokes the previous dev key and prints a new one, so exactly
  # one is ever active.
  keys:
    <<: *agentd
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        agentd keys list
        | awk -F '\t' '$$3 == "wrkspc_01dev" && $$4 == "active" && $$7 == "dev" { print $$1 }'
        | xargs -r -n1 agentd keys revoke
        && agentd keys create --org org_dev --workspace wrkspc_01dev --name dev
    depends_on:
      localstack:
        condition: service_healthy

  agentd:
    <<: *agentd
    container_name: ${AGENTD_CONTAINER:-agentd}
    ports:
      - "127.0.0.1:8080:8080"
    networks: [default, control]
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully   # schema ready before boot
      localstack:
        condition: service_healthy
      docker:
        condition: service_started
      egress:
        condition: service_started
    deploy:
      replicas: ${AGENTD_REPLICAS:-1}   # one: event streams and timers are per process

  # The egress proxy: sandboxes reach it on their own networks; it reads each
  # credential from Secrets Manager when a request needs it. No shell in the
  # image, a non-root user, a read-only root filesystem, no capabilities and
  # no core dumps. Its admin interface listens on the control network only.
  egress:
    build:
      context: ..
      dockerfile: docker/egress/Dockerfile
    image: agentd-egress:dev
    container_name: ${AGENTD_CONTAINER:-agentd}-egress
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
      # Secret buffers are locked in RAM so they never reach swap.
      memlock: 67108864
    environment:
      AGENTD_EGRESS_ADDR: 0.0.0.0:8890
      AGENTD_EGRESS_ADMIN_ADDR: ${AGENTD_CONTROL_NET:-172.31.250}.3:8891
      AGENTD_EGRESS_ADMIN_TOKEN: ${AGENTD_EGRESS_ADMIN_TOKEN:?set AGENTD_EGRESS_ADMIN_TOKEN}
      # Its own credentials in production: a role that may only read
      # credential values (deploy/iam/egress-secrets-policy.json).
      AGENTD_SECRETS_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      RUST_LOG: info
    networks:
      default: {}
      control:
        ipv4_address: ${AGENTD_CONTROL_NET:-172.31.250}.3
    depends_on:
      localstack:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine   # Flyway 11 supports PG 9.5–latest; 16 is the safe LTS-grade pick
    environment:
      POSTGRES_DB: agentd
      POSTGRES_USER: agentd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentd"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3, Secrets Manager and KMS. Healthy once the init hook has made the KMS
  # key (docker/localstack/ready.d).
  localstack:
    image: localstack/localstack:3.0
    environment:
      SERVICES: s3,secretsmanager,kms
    volumes:
      - ./localstack/ready.d:/etc/localstack/init/ready.d:ro
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "awslocal kms describe-key --key-id alias/agentd-secrets >/dev/null"]
      interval: 3s
      timeout: 30s
      start_period: 60s
      retries: 60

  # The sandbox runtime's Docker API: networks, images and containers only,
  # so agentd never holds the raw socket. Creating containers is still as
  # strong as root on that daemon's host: in production give agentd a Docker
  # daemon on a host or VM of its own (docs/configuration.md, Security).
  docker:
    image: tecnativa/docker-socket-proxy:v0.4.1
    environment:
      POST: 1
      CONTAINERS: 1
      NETWORKS: 1
      IMAGES: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  # agentd and the egress service only: the egress admin interface.
  control:
    internal: true
    ipam:
      config:
        - subnet: ${AGENTD_CONTROL_NET:-172.31.250}.0/24

volumes:
  pg_data:
