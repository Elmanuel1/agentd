# agentd stack: control plane + AWS-native persistence (emulated locally).
#
# Persistence is DynamoDB (shared entity state) + S3 (blobs) via the
# agentd-store-aws crate — so agentd replicas are stateless and scale
# horizontally. Locally these are emulated by Floci, the token-free MIT
# LocalStack successor (`:4566`, LocalStack-endpoint-compatible). For real
# AWS, drop AGENTD_AWS_ENDPOINT and give the container an IAM role.

services:
  agentd:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      AGENTD_ADDR: 0.0.0.0:8080
      AGENTD_API_KEYS: ${AGENTD_API_KEYS:-agentd-dev-key:org_dev:wrkspc_01dev}
      # Persistence backend + emulator endpoint.
      AGENTD_STORE: ${AGENTD_STORE:-aws}
      AGENTD_AWS_ENDPOINT: http://aws:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      RUST_LOG: info
    depends_on:
      - aws
    deploy:
      replicas: ${AGENTD_REPLICAS:-1}   # DynamoDB conditional writes keep N replicas exactly-once

  # Local AWS emulator (DynamoDB + S3). Default: Floci — 24ms start, no token.
  # Swap `image` to `ministack/ministack` or `localstack/localstack:latest`
  # (the latter needs LOCALSTACK_AUTH_TOKEN since 2026.03.0) — all speak :4566.
  aws:
    image: ${AGENTD_AWS_IMAGE:-floci/floci:latest}
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    user: root

  # Optional: scheduler backend for the Temporal SchedulerPort impl.
  # Dev uses the in-process LocalScheduler; set AGENTD_SCHEDULER=temporal to swap.
  # temporal:
  #   image: temporalio/auto-setup:latest
  #   ports: ["7233:7233"]
