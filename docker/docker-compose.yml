# agentd stack.
#
# DEFAULT persistence: PostgreSQL (Flyway-migrated) — chosen because the
# product is dashboard-first (list / filter / sort / search / count are plain
# SQL). agentd stays stateless across replicas (all state in Postgres);
# multi-replica exactly-once is a native INSERT … ON CONFLICT DO NOTHING.

services:
  # ── migrations: Flyway 11 applies the schema, then exits ──────────────
  flyway:
    image: flyway/flyway:11-alpine
    command: >
      -url=jdbc:postgresql://postgres:5432/agentd
      -user=agentd -password=${POSTGRES_PASSWORD:-agentd}
      -locations=filesystem:/flyway/sql -connectRetries=20 migrate
    volumes:
      - ../crates/adapters/store-postgres/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  agentd:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      AGENTD_ADDR: 0.0.0.0:8080
      AGENTD_API_KEYS: ${AGENTD_API_KEYS:-agentd-dev-key:org_dev:wrkspc_01dev}
      # Records → Postgres; file BYTES → object storage (MinIO locally, real S3 in prod).
      AGENTD_STORE: ${AGENTD_STORE:-postgres}
      DATABASE_URL: postgres://agentd:${POSTGRES_PASSWORD:-agentd}@postgres:5432/agentd
      AGENTD_AWS_ENDPOINT: http://minio:9000     # blobs; drop this for real S3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-agentd}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-agentd-dev-secret}
      AWS_DEFAULT_REGION: us-east-1
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully   # schema ready before boot
      minio:
        condition: service_started
    deploy:
      replicas: ${AGENTD_REPLICAS:-1}   # ON CONFLICT keeps N replicas exactly-once

  postgres:
    image: postgres:16-alpine   # Flyway 11 supports PG 9.5–latest; 16 is the safe LTS-grade pick
    environment:
      POSTGRES_DB: agentd
      POSTGRES_USER: agentd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentd}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentd"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Object storage for file BYTES (never in the DB). MinIO locally = real S3
  # in prod (drop AGENTD_AWS_ENDPOINT to use AWS S3 directly).
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agentd}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-agentd-dev-secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"


volumes:
  pg_data:
  minio_data:
