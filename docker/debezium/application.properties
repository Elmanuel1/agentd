# Debezium Server: agentd's change feed. It reads the committed changes of
# the tables below from Postgres's WAL (pgoutput, a publication and slot of
# its own) and writes each table's to the Valkey stream
# `agentd.public.<table>`, which agentd reads in its consumer group.
#
# The same file runs in dev, CI and production; each deployment sets its
# connections through the environment, which overrides any key here
# (`debezium.source.database.hostname` is DEBEZIUM_SOURCE_DATABASE_HOSTNAME):
#   DEBEZIUM_SOURCE_DATABASE_HOSTNAME, _PORT, _DBNAME, _USER, _PASSWORD
#   DEBEZIUM_SOURCE_OFFSET_STORAGE_JDBC_CONNECTION_URL, _USER, _PASSWORD
#   DEBEZIUM_SINK_REDIS_ADDRESS, DEBEZIUM_SINK_REDIS_PASSWORD

debezium.sink.type=redis
debezium.sink.redis.address=valkey:6379
debezium.sink.redis.message.format=extended
# Heartbeats go to the stream `__debezium-heartbeat.agentd`, which agentd does
# not read: the sink stalls on a heartbeat it is told to skip.
debezium.sink.redis.skip.heartbeat.messages=false

debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.plugin.name=pgoutput
debezium.source.topic.prefix=agentd
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.dbname=agentd
debezium.source.database.user=agentd
debezium.source.table.include.list=public.schedule_outbox
debezium.source.publication.name=agentd_changes
debezium.source.publication.autocreate.mode=filtered
debezium.source.slot.name=agentd_changes
# Only changes from now on: agentd reacts to commits, not to existing rows.
debezium.source.snapshot.mode=no_data

# Offsets live in Postgres beside the data; the store creates its table.
debezium.source.offset.storage=io.debezium.storage.jdbc.offset.JdbcOffsetBackingStore
debezium.source.offset.storage.jdbc.connection.url=jdbc:postgresql://postgres:5432/agentd
debezium.source.offset.storage.jdbc.connection.user=agentd
debezium.source.offset.storage.jdbc.table.name=debezium_offsets
debezium.source.offset.flush.interval.ms=1000

# The publication carries only the tables above, so between their changes the
# slot would hold back the WAL of every other write. A logical message each
# minute moves the slot on; its prefix is read and dropped, never streamed.
debezium.source.heartbeat.interval.ms=60000
debezium.source.heartbeat.action.query=SELECT pg_logical_emit_message(false, 'agentd-heartbeat', now()::text)
debezium.source.message.prefix.exclude.list=agentd-heartbeat

debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.key=json
debezium.format.key.schemas.enable=false
