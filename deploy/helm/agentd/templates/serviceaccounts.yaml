{{- /* One ServiceAccount per role and one for the migrations, so a cloud role bound to one (IRSA, EKS Pod Identity,
GKE Workload Identity) reaches only its pods. None mounts an API token: agentd never calls the Kubernetes API. */ -}}
{{- range $role, $spec := .Values.roles }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-{{ $role }}
  labels:
    {{- include "agentd.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
  {{- with ($spec.serviceAccount | default dict).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-migrations
  labels:
    {{- include "agentd.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    # The migrations Job is a pre-install hook, so its account is an earlier one.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with (.Values.migrations.serviceAccount | default dict).annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
