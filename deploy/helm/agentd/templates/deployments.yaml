{{- range $role, $spec := .Values.roles }}
---
{{- if $.Values.argoRollouts.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ $.Release.Name }}-{{ $role }}
  labels:
    {{- include "agentd.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  replicas: {{ $spec.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $role }}
  {{- if $.Values.argoRollouts.enabled }}
  {{- include "agentd.rolloutStrategy" (dict "Values" $.Values "Release" $.Release "role" $role) | nindent 2 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "agentd.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $role }}
      annotations:
        checksum/config: {{ toJson $.Values.env | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: agentd
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENTD_ROLE
              value: {{ $role }}
            {{- include "agentd.databaseUrl" $ | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ $.Release.Name }}
            {{- range $.Values.envFromSecrets }}
            - secretRef:
                name: {{ .name }}
                optional: {{ .optional | default false }}
            {{- end }}
          # agentd has no health route (live has none); a replica that listens is serving.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $.Values.preStopSleepSeconds }}
          resources:
            {{- toYaml $spec.resources | nindent 12 }}
          securityContext:
            {{- include "agentd.securityContext" $ | nindent 12 }}
{{- end }}
