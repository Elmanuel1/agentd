apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrations
  labels:
    {{- include "agentd.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "agentd.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      {{- include "agentd.scheduling" (dict "Values" .Values "spec" .Values.migrations) | nindent 6 }}
      containers:
        - name: flyway
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}"
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          args: [migrate]
          env:
            {{- include "agentd.databaseCredentials" . | nindent 12 }}
            - name: FLYWAY_URL
              value: "jdbc:postgresql://{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslMode }}"
            - name: FLYWAY_USER
              value: $(PGUSER)
            - name: FLYWAY_PASSWORD
              value: $(PGPASSWORD)
            - name: FLYWAY_CONNECT_RETRIES
              value: "20"
            - name: FLYWAY_POSTGRESQL_TRANSACTIONAL_LOCK
              value: "false"
