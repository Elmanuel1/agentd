# Valkey 9: a one-node cluster with AOF, announced by its Service name, as compose runs it. The readiness probe
# gives the node every slot on its first run.
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector: { app: valkey }
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels: { app: valkey }
  template:
    metadata:
      labels: { app: valkey }
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.0-alpine
          args:
            - valkey-server
            - --cluster-enabled
            - "yes"
            - --cluster-announce-hostname
            - valkey
            - --cluster-preferred-endpoint-type
            - hostname
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  valkey-cli cluster info | grep -q cluster_state:ok
                  || { valkey-cli cluster addslotsrange 0 16383 >/dev/null; false; }
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
